<!DOCTYPE html>
<html>
<head>
    <title>Reverse Number</title>
</head>
<body>

    <h2>Reverse Number</h2>
    <p id="output"></p>

    <script>
        let number = 12345;
        let temp = number;
        let reverse = 0;

        while (temp > 0) {
            let digit = temp % 10;
            reverse = reverse * 10 + digit;
            temp = Math.floor(temp / 10);
        }

        document.getElementById("output").innerHTML =
            "Reverse of " + number + " = " + reverse;
    </script>

</body>
</html>
