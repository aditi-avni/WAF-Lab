<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>

    <h2>Multiplication Table</h2>
    <p id="output"></p>

    <script>
        let number = 5;
        let result = "";

        for (let i = 1; i <= 10; i++) {
            result += number + " × " + i + " = " + (number * i) + "<br>";
        }

        document.getElementById("output").innerHTML = result;
    </script>

</body>
</html>
