<!DOCTYPE html>
<html>
<head>
    <title>Mouseover Event</title>
</head>
<body>

    <h2>Move the mouse over the button</h2>

    <button onmouseover="changeColor()">
        Move Mouse Here
    </button>

    <script>
        function changeColor() {
            document.body.style.backgroundColor = "lightgreen";
        }
    </script>

</body>
</html>
